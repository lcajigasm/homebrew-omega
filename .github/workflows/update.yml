name: Update formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update formula from the latest omega release
        run: python3 .github/scripts/update-formula.py

      - name: Commit and push when the formula changes
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/omega.rb
          if git diff --cached --quiet; then
            echo "Formula already matches the latest release; no commit."
            exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to push formula updates from ${GITHUB_REF}."
            exit 1
          fi
          version="$(grep -oE 'releases/download/v[0-9][^"/]+' Formula/omega.rb | head -n 1 | sed 's#.*/v##')"
          git commit -m "omega ${version}"
          git push origin HEAD:main

      - name: Fail unless the formula matches the latest omega tag
        if: success() || failure()
        run: python3 .github/scripts/check-formula-version.py
