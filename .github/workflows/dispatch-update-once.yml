name: Dispatch update once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-update-once.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
